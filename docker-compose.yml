services:
  db:
    image: postgres:18-alpine
    container_name: fsapp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: fsapp-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:supersecretpassword@db:5432/postgres
      FRONTEND_URL: http://localhost:3000
    env_file:
      - ./backend/.env.development
    volumes:
      - ./backend:/app
      - ./shared:/shared
    command: run --allow-net --allow-env --allow-read=/shared --watch main.ts
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:26-alpine
    container_name: fsapp-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Run dev server bypassing pre/postinstall hooks using locked dependencies
    command: sh -c "if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi && npm run dev"
    depends_on:
      - backend

volumes:
  pgdata:
