services:
  backend:
    build:
      context: .
      args:
        # Map the Dokploy Env Var to the Docker Build Arg
        RUN_MIGRATIONS: ${RUN_MIGRATIONS} 
      dockerfile: ./backend/Dockerfile
    environment:
      # Inject the external PostgreSQL connection string created in Dokploy dashboard
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_PUBLIC_URL}
      CORS_ORIGIN: ${FRONTEND_PUBLIC_URL}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BACKEND_PUBLIC_URL}
    environment:
      VITE_API_URL: ${BACKEND_PUBLIC_URL}
    depends_on:
      - backend

